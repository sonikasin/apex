<!-- templates/admin_panel/propaccount_assign.html -->
{% extends 'admin_panel/base.html' %}

{% block title %}تحویل حساب{% endblock %}

{% block header_title %}تحویل حساب{% endblock %}

{% block content %}
    <h2>تحویل حساب {{ account.account_number }}</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>پلن:</label>
        <select name="plan_type" id="plan_type" required>
            <option value="">انتخاب پلن</option>
            {% for plan in plans %}
                <option value="{{ plan.id }}" data-account-size="{{ plan.account_size }}" {% if selected_plan == plan.id|stringformat:'s' %}selected{% endif %}>{{ plan.name }} - اندازه: {{ plan.account_size }}</option>
            {% endfor %}
        </select>

        <label>ایمیل کاربر:</label>
        <input type="text" id="user_email" name="user_email" value="{{ selected_user_email }}" placeholder="جستجو کاربر..." oninput="searchUsers(this.value)" required>
        <input type="hidden" id="user_id" name="user_id" value="">

        <div id="user_results"></div>

        <label>موجودی:</label>
        <input type="number" id="balance" name="balance" value="{{ account.balance|default:'' }}" required>
        <label>آیدی سفارش (اختیاری):</label>
            <input
                type="number"
                id="order_id"
                name="order_id"
                placeholder="مثلاً: 125"
                value="{{ selected_order_id }}"
            >


        <label>لِوِل حساب:</label>
        <select name="level" id="level" required>
            <option value="">انتخاب لِوِل</option>
            {% for level_value, level_display in level_choices %}
                <option value="{{ level_value }}" {% if selected_level == level_value %}selected{% endif %}>{{ level_display }}</option>
            {% endfor %}
        </select>

        <button type="submit">تحویل</button>
    </form>

    <script>
        document.getElementById('plan_type').addEventListener('change', function() {
            var selectedOption = this.options[this.selectedIndex];
            var accountSize = selectedOption.getAttribute('data-account-size');
            if (accountSize) {
                document.getElementById('balance').value = accountSize;
            }
        });

        function searchUsers(query) {
            if (query.length < 3) {
                document.getElementById('user_results').innerHTML = '';
                return;
            }
            fetch('{% url "admin_panel:user_search" %}?q=' + encodeURIComponent(query))
                .then(response => response.json())
                .then(data => {
                    let results = document.getElementById('user_results');
                    results.innerHTML = '';
                    data.users.forEach(user => {
                        let div = document.createElement('div');
                        div.style.padding = '10px';
                        div.style.cursor = 'pointer';
                        div.textContent = user.email + ' (' + user.first_name + ' ' + user.last_name + ')';
                        div.onclick = () => {
                            document.getElementById('user_email').value = user.email;
                            document.getElementById('user_id').value = user.id;
                            results.innerHTML = '';
                        };
                        results.appendChild(div);
                    });
                });
        }
    </script>
{% endblock %}
