<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأیید ایمیل</title>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #10b981;
        }
        h1 {
            font-size: 24px;
            color: #10b981;
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #b0b0b0;
            text-align: center;
        }
        .code {
            display: inline-block;
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            background-color: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            margin: 20px 0;
            letter-spacing: 5px;
        }
        .footer {
            text-align: center;
            font-size: 14px;
            color: #b0b0b0;
            margin-top: 30px;
        }
        .footer a {
            color: #10b981;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تأیید ایمیل</h1>
        <p>با تشکر از ثبت‌نام در Apex Fx! برای تکمیل ثبت‌نام، لطفاً از کد تأیید زیر استفاده کنید:</p>
        <div class="code">{{ code }}</div>
        <p>این کد را در صفحه تأیید ایمیل وارد کنید تا حساب شما فعال شود.</p>
        <div class="footer">
            <p>نیاز به کمک دارید؟ <a href="mailto:support@krjfx.com">با ما تماس بگیرید</a></p>
            <p>&copy; ۱۴۰۴ Apex Fx. تمامی حقوق محفوظ است.</p>
        </div>
    </div>
</body>
</html>
