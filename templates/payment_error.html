{% extends 'base_dashboard.html' %}
{% load static %}

{% block title %}خطا در پرداخت{% endblock %}

{% block content %}
<section class="status-wrap">
    <div class="status-card">
        <div class="status-icon status-icon--error">
            <i class="fas fa-xmark"></i>
        </div>
        <h2 class="status-title">خطا در پرداخت</h2>
        <p class="status-text">{{ message }}</p>
        <div class="status-actions">
            {% if order %}
            <a href="{% url 'payment' order.order_number %}" class="status-btn status-btn--primary"><i class="fas fa-rotate-right"></i> تلاش مجدد</a>
            {% else %}
            <a href="{% url 'index' %}" class="status-btn status-btn--primary"><i class="fas fa-rotate-right"></i> تلاش مجدد</a>
            {% endif %}
            <a href="{% url 'dashboard' %}" class="status-btn status-btn--ghost">بازگشت به داشبورد</a>
        </div>
    </div>
</section>
{% endblock %}
