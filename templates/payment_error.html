{% extends 'base_dashboard.html' %}
{% load static %}

{% block title %}خطا در پرداخت{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-icon">
        <i class="fas fa-exclamation-circle"></i>
    </div>
    <h2 class="error-title">خطا در پرداخت</h2>
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
        <a href="{% url 'dashboard' %}" class="action-btn">بازگشت به داشبورد</a>
        {% if order %}
        <a href="{% url 'payment' order.order_number %}" class="action-btn">تلاش مجدد</a>
        {% else %}
        <a href="{% url 'index' %}" class="action-btn">تلاش مجدد</a>
        {% endif %}
    </div>
</div>
<style>
    .error-container {
        padding: 2rem;
        max-width: 600px;
        margin: 0 auto;
        min-height: calc(100vh - 120px);
        text-align: center;
    }

    .error-icon {
        font-size: 3rem;
        color: #e74c3c;
        margin-bottom: 1rem;
    }

    body.light-mode .error-icon {
        color: #c0392b;
    }

    .error-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #10b981;
        margin-bottom: 1rem;
    }

    .error-message {
        font-size: 1rem;
        color: #b0b0b0;
        margin-bottom: 1.5rem;
    }

    body.light-mode .error-message {
        color: #4b5563;
    }

    .error-actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
    }

    .action-btn {
        padding: 0.8rem 1.5rem;
        background: linear-gradient(90deg, #10b981, #059669);
        color: #121212;
        text-decoration: none;
        font-weight: 600;
        border-radius: 25px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    body.light-mode .action-btn {
        color: #ffffff;
    }

    .action-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }

    /* Responsive Design */
    @media (max-width: 480px) {
        .error-container {
            padding: 1rem;
        }

        .error-icon {
            font-size: 2rem;
        }

        .error-title {
            font-size: 1.2rem;
        }

        .error-message {
            font-size: 0.9rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }
    }

    @media (min-width: 481px) and (max-width: 768px) {
        .error-container {
            padding: 1.5rem;
        }

        .error-title {
            font-size: 1.5rem;
        }

        .action-btn {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }
    }

    @media (min-width: 769px) and (max-width: 1200px) {
        .error-container {
            padding: 2rem;
        }

        .error-title {
            font-size: 1.7rem;
        }
    }

    @media (min-width: 1201px) {
        .error-container {
            padding: 2.5rem;
        }

        .error-title {
            font-size: 2rem;
        }

        .action-btn {
            padding: 0.9rem 1.7rem;
        }
    }
</style>
{% endblock %}
