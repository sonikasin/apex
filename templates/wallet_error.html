{% extends 'base_dashboard.html' %}
{% load static %}

{% block title %}خطا در واریز{% endblock %}

{% block content %}
<section class="status-wrap">
    <div class="status-card">
        <div class="status-icon status-icon--error">
            <i class="fas fa-xmark"></i>
        </div>
        <h2 class="status-title">خطا در واریز</h2>
        <p class="status-text">{{ message }}</p>
        <div class="status-summary">
            <div class="status-summary__row"><span>موجودی فعلی کیف پول</span><span>{{ wallet.balance_usd|floatformat:2 }} دلار</span></div>
        </div>
        <div class="status-actions">
            <a href="{% url 'wallet_deposit' %}" class="status-btn status-btn--primary"><i class="fas fa-rotate-right"></i> تلاش مجدد</a>
            <a href="{% url 'dashboard' %}" class="status-btn status-btn--ghost">بازگشت به داشبورد</a>
        </div>
    </div>
</section>
{% endblock %}
