{% extends 'base_dashboard.html' %}
{% load static %}

{% block title %}واریز موفق{% endblock %}

{% block content %}
<section class="status-wrap">
    <div class="status-card">
        <div class="status-icon status-icon--success">
            <i class="fas fa-check"></i>
        </div>
        <h2 class="status-title">واریز موفق</h2>
        <p class="status-text">{{ message }}</p>
        <div class="status-summary">
            <div class="status-summary__row"><span>موجودی جدید کیف پول</span><span>{{ wallet.balance_usd|floatformat:2 }} دلار</span></div>
        </div>
        <div class="status-actions">
            <a href="{% url 'dashboard' %}" class="status-btn status-btn--primary">بازگشت به داشبورد</a>
            <a href="{% url 'wallet_deposit' %}" class="status-btn status-btn--ghost"><i class="fas fa-plus"></i> واریز مجدد</a>
        </div>
    </div>
</section>
{% endblock %}
