<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال اطلاعات کاربر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1a3c34 0%, #2e5e54 100%); /* گرادیانت سبز تیره */
            color: #e0e0e0;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            padding: 30px;
            background-color: #2e5e54;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px); /* انیمیشن بالا آمدن */
        }
        h1 {
            text-align: center;
            color: #a8dadc; /* آبی روشن */
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        label {
            font-size: 1.1rem;
            color: #e0e0e0;
            margin-bottom: 5px;
        }
        input {
            padding: 12px;
            border: 2px solid #457b9d; /* آبی تیره */
            border-radius: 8px;
            font-size: 1rem;
            background-color: #3a6b62; /* سبز تیره‌تر */
            color: #e0e0e0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #a8dadc; /* آبی روشن */
            box-shadow: 0 0 8px rgba(168, 218, 220, 0.5);
        }
        button {
            background-color: #457b9d;
            color: #e0e0e0;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button:hover {
            background-color: #a8dadc;
            color: #1a3c34;
            transform: scale(1.05);
        }
        .messages {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }
        .messages li {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 1rem;
        }
        .messages .success {
            background-color: #2e7d32; /* سبز تیره برای موفقیت */
            color: #e0e0e0;
        }
        .messages .error {
            background-color: #d32f2f; /* قرمز برای خطا */
            color: #e0e0e0;
        }

        /* ریسپانسیو برای گوشی */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            label {
                font-size: 1rem;
            }
            input, button {
                font-size: 0.9rem;
                padding: 10px;
            }
            button {
                padding: 12px;
            }
        }
        @media (max-width: 400px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.2rem;
                margin-bottom: 20px;
            }
            input, button {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ارسال اطلاعات</h1>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div>
                <label for="instagram_id">آیدی اینستاگرام:</label>
                <input type="text" id="instagram_id" name="instagram_id" value="{{ instagram_id }}" required>
            </div>
            <div>
                <label for="telegram_id">آیدی تلگرام:</label>
                <input type="text" id="telegram_id" name="telegram_id" value="{{ telegram_id }}" required>
            </div>
            <div>
                <label for="email">ایمیل:</label>
                <input type="email" id="email" name="email" value="{{ email }}" required>
            </div>
            <button type="submit">ارسال</button>
        </form>
    </div>
</body>
</html>
