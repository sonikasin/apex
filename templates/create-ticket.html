{% extends 'base_dashboard.html' %}
{% block title %}ساخت تیکت جدید{% endblock %}
{% block content %}
<div class="dash-container">
    <div class="dash-page-section" style="max-width: 680px; margin: 0 auto;">
        <div class="dash-page-section__header">
            <h2 class="dash-page-section__title">ساخت تیکت جدید</h2>
            <a href="{% url 'ticket_list' %}" class="dash-btn dash-btn--secondary dash-btn--sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                بازگشت
            </a>
        </div>

        <form method="post" class="dash-form">
            {% csrf_token %}
            <div class="dash-form__group">
                <label class="dash-form__label" for="department">دپارتمان</label>
                <select name="department" id="department" class="dash-form__select" required>
                    <option value="" disabled selected>انتخاب دپارتمان</option>
                    <option value="technical">پشتیبانی فنی</option>
                    <option value="financial">پشتیبانی مالی</option>
                    <option value="general">پشتیبانی عمومی</option>
                </select>
            </div>
            <div class="dash-form__group">
                <label class="dash-form__label" for="account">حساب پراپ</label>
                <select name="account" id="account" class="dash-form__select">
                    <option value="" selected>بدون حساب (اختیاری)</option>
                    {% for account in user.prop_accounts.all %}
                        <option value="{{ account.id }}">{{ account.account_number }} - {{ account.plan.get_name_display }} ({{ account.get_level_display }})</option>
                    {% endfor %}
                </select>
                <small class="dash-form__hint">حسابی که مربوط به این تیکت هست را انتخاب کنید تا روند پاسخگویی سریع‌تر انجام شود.</small>
            </div>
            <div class="dash-form__group">
                <label class="dash-form__label" for="subject">موضوع</label>
                <input type="text" name="subject" id="subject" class="dash-form__input" placeholder="موضوع تیکت" required>
            </div>
            <div class="dash-form__group">
                <label class="dash-form__label" for="message">پیام</label>
                <textarea name="message" id="message" class="dash-form__textarea" placeholder="متن پیام خود را وارد کنید..." required></textarea>
            </div>
            <button type="submit" class="dash-btn dash-btn--primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                ارسال تیکت
            </button>
        </form>
    </div>
</div>
{% endblock %}
